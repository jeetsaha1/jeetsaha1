      <stop offset="0%" stop-color="#07111A"/>
      <stop offset="50%" stop-color="#081820"/>
      <stop offset="100%" stop-color="#07111A"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#008CFF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="130" fill="url(#fbg)"/>
  <path d="M0,90 C 150,60 300,110 500,85 S 800,55 1000,90 L1000,130 L0,130 Z" fill="url(#wave-grad)" opacity="0.18"/>
  <path d="M0,95 C 150,68 300,115 500,92 S 800,62 1000,95" fill="none" stroke="url(#wave-grad)" stroke-width="2" opacity="0.8">
    <animate attributeName="stroke-dasharray" values="0,2000;1000,1000;0,2000" dur="8s" repeatCount="indefinite"/>
  </path>
  <g opacity="0.5">
