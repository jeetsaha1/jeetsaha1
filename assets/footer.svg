    <circle cx="330" cy="22" r="2" fill="#00A8FF"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="34" r="2.5" fill="#00D9FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="20" r="2" fill="#00E676"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="32" r="2.5" fill="#00A8FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
