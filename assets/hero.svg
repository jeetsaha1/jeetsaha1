<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111A"/>
      <stop offset="100%" stop-color="#0B1117"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#008CFF"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2A43" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.45"/>

  <!-- neural network (right side) -->
  <g stroke="#00A8FF" stroke-width="1" opacity="0.55">
    <line x1="700" y1="80" x2="800" y2="60">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="80" x2="790" y2="130">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="790" y1="130" x2="880" y2="100">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="60" x2="890" y2="90">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.7s" repeatCount="indefinite"/>
    </line>
    <line x1="790" y1="130" x2="820" y2="210">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="100" x2="920" y2="170">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <line x1="820" y1="210" x2="900" y2="240">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="170" x2="900" y2="240">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="3.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle cx="700" cy="80" r="22" fill="url(#node-glow)"/>
    <circle cx="700" cy="80" r="4" fill="#00E676"/>
    <circle cx="800" cy="60" r="18" fill="url(#node-glow-blue)"/>
    <circle cx="800" cy="60" r="3.5" fill="#00A8FF"/>
    <circle cx="790" cy="130" r="20" fill="url(#node-glow)"/>
    <circle cx="790" cy="130" r="4" fill="#00E676">
      <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="100" r="18" fill="url(#node-glow-blue)"/>
    <circle cx="880" cy="100" r="3.5" fill="#00A8FF"/>
    <circle cx="890" cy="90" r="14" fill="url(#node-glow)"/>
    <circle cx="890" cy="90" r="3" fill="#00D9FF"/>
    <circle cx="820" cy="210" r="18" fill="url(#node-glow-blue)"/>
    <circle cx="820" cy="210" r="3.5" fill="#00A8FF"/>
    <circle cx="920" cy="170" r="16" fill="url(#node-glow)"/>
    <circle cx="920" cy="170" r="3" fill="#00E676"/>
    <circle cx="900" cy="240" r="18" fill="url(#node-glow-blue)"/>
    <circle cx="900" cy="240" r="3.5" fill="#00D9FF">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="60" y="200" width="330" height="92" rx="10" fill="#0B1620" stroke="#0F2A43" stroke-width="1.5"/>
    <circle cx="80" cy="216" r="4" fill="#FF5F57"/>
    <circle cx="94" cy="216" r="4" fill="#FEBC2E"/>
    <circle cx="108" cy="216" r="4" fill="#28C840"/>
    <text x="76" y="244" font-family="monospace" font-size="13" fill="#00E676">jeet@dev</text>
    <text x="150" y="244" font-family="monospace" font-size="13" fill="#94A3B8">:~$ run intelligent_systems.py</text>
    <text x="76" y="266" font-family="monospace" font-size="13" fill="#00D9FF">&gt; training model... optimizing CFD solver...</text>
    <rect x="76" y="272" width="8" height="14" fill="#00E676">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- name + tagline -->
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#text-grad)">JEET SAHA</text>
  <text x="60" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#F8FAFC">Computer Science &amp; Engineering</text>
  <text x="60" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">AI/ML • Full-Stack Development • Computational Fluid Dynamics</text>
  <text x="60" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00D9FF" letter-spacing="1.5">BUILDING INTELLIGENT SYSTEMS</text>
</svg>
